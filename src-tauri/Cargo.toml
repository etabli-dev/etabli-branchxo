[package]
name = "etabli-branchxo"
version = "0.1.0"
description = "Desktop shell for branchxo, the multiverse tic-tac-toe game"
authors = ["R. Heller"]
license = "Apache-2.0"
repository = "https://github.com/etabli-dev/etabli-branchxo"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
