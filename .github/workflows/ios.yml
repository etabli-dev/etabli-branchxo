name: Native iOS build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
      - run: xcodebuild -version
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - run: pod install
        working-directory: ios
      - name: Compile unsigned iPhone release
        env:
          EXTRA_PACKAGER_ARGS: '--max-workers 2'
        run: |
          set -o pipefail
          xcodebuild -workspace ios/etablibranchxo.xcworkspace -scheme etablibranchxo \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath .native-build -jobs 2 CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios-build.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-native-build-log
          path: ios-build.log
