name: Desktop packages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    # Unsigned Tauri packages around the web export. Signing, notarization and
    # release publication are separate owner steps (docs/platform-roadmap.md).
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact: branchxo-desktop-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            artifact: branchxo-desktop-windows-x64
          - os: macos-15
            target: universal-apple-darwin
            bundles: dmg
            artifact: branchxo-desktop-macos-universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUST_TOOLCHAIN: '1.93.1'
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install the WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev \
            build-essential file patchelf xvfb
      - name: Install the Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          if [ "$TARGET" = universal-apple-darwin ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi
      - run: npm ci
      - name: Build the web export and the desktop packages
        shell: bash
        run: |
          if [ "$TARGET" = universal-apple-darwin ]; then
            npx tauri build --ci --target "$TARGET" --bundles "$BUNDLES" -- --locked
          else
            npx tauri build --ci --bundles "$BUNDLES" -- --locked
          fi
      - name: Launch the packaged binary on a virtual display
        if: runner.os == 'Linux'
        run: |
          status=0
          xvfb-run -a timeout --preserve-status 10s src-tauri/target/release/etabli-branchxo || status=$?
          # 143 = still running after 10 s and stopped by SIGTERM.
          test "$status" -eq 143
          dpkg-deb -I src-tauri/target/release/bundle/deb/etabli-branchxo_*_amd64.deb
          dpkg-deb -c src-tauri/target/release/bundle/deb/etabli-branchxo_*_amd64.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
