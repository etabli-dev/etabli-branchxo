name: Application checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx expo install --check
      - run: npm run export -- --platform all
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-evidence
          path: test-results/
  dependency-audit:
    # Keep high/critical findings blocking independently of functional checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.4'
      - run: npm ci
      - run: npm audit --audit-level high
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.4'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install the matching native toolchain
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build local development APKs (Android Debug signing)
        # Debug expects Metro; release includes the game bundle. Both use Expo's
        # generated Android Debug key and are not signed for store distribution.
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:assembleRelease -PreactNativeArchitectures=arm64-v8a
        working-directory: android
      - name: Verify standalone bundle is packaged
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('android/app/build/outputs/apk/release/app-release.apk') as apk:
              assert apk.getinfo('assets/index.android.bundle').file_size > 100_000
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-local-development-apks
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
